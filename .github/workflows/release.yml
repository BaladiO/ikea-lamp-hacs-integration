name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches manifest.json
        run: |
          version=$(python3 -c "import json;print(json.load(open('custom_components/obegraensad_lamp/manifest.json'))['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != manifest ${version}"; exit 1; }
      - name: Build zip
        run: cd custom_components/obegraensad_lamp && zip -r ../../obegraensad_lamp.zip . -x "__pycache__/*"
      - name: Release notes from CHANGELOG.md
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'EOF'
          import re, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[?{re.escape(sys.argv[1])}\]?.*?\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not match:
              sys.exit(f"no CHANGELOG entry for {sys.argv[1]}")
          open("notes.md", "w", encoding="utf-8").write(match.group(1).strip() + "\n")
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          files: obegraensad_lamp.zip
          body_path: notes.md
