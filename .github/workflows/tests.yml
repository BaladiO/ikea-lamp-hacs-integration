name: Lint and test

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: sudo apt-get update && sudo apt-get install -y libturbojpeg0
      - run: pip install -r requirements_test.txt
      - run: mypy custom_components/obegraensad_lamp
      - run: pytest -p no:cacheprovider --timeout 120 --cov --cov-report=term-missing
