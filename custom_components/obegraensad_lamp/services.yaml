select_plugin:
  target:
    entity:
      integration: obegraensad_lamp
  fields:
    plugin:
      required: true
      example: Weather
      selector:
        text:

set_brightness_schedule:
  target:
    entity:
      integration: obegraensad_lamp
  fields:
    enabled:
      selector:
        boolean:
    start:
      example: "22:00"
      selector:
        time:
    end:
      example: "07:00"
      selector:
        time:
    brightness:
      example: 20
      selector:
        number:
          min: 0
          max: 255

set_plugin_schedule:
  target:
    entity:
      integration: obegraensad_lamp
  fields:
    action:
      default: set
      selector:
        select:
          translation_key: schedule_action
          options:
            - set
            - start
            - stop
            - clear
    schedule:
      example: '[{"plugin": "Weather", "duration": 60}, {"plugin": "Big Clock", "duration": 30}]'
      selector:
        object:

send_message:
  target:
    entity:
      integration: obegraensad_lamp
  fields:
    text:
      example: DOOR
      selector:
        text:
    repeat:
      example: 0
      selector:
        number:
          min: -1
          max: 1000
          mode: box
    delay:
      example: 50
      selector:
        number:
          min: 10
          max: 1000
          unit_of_measurement: ms
          mode: box
    message_id:
      example: bathroom
      selector:
        text:
    priority:
      default: normal
      selector:
        select:
          translation_key: priority
          options:
            - low
            - normal
            - high
    restore:
      default: true
      selector:
        boolean:
    graph:
      example: "[1, 4, 9, 15, 9, 4, 1]"
      selector:
        object:
    miny:
      default: 0
      selector:
        number:
          min: -100000
          max: 100000
          mode: box
    maxy:
      default: 15
      selector:
        number:
          min: -100000
          max: 100000
          mode: box

remove_message:
  target:
    entity:
      integration: obegraensad_lamp
  fields:
    message_id:
      example: bathroom
      selector:
        text:
    all:
      default: false
      selector:
        boolean:

show_icon:
  target:
    entity:
      integration: obegraensad_lamp
  fields:
    icon:
      example: door
      selector:
        select:
          translation_key: icon
          options:
            - door
            - bell
            - shower
            - fan
            - light_bulb
            - warning
            - check
            - cross
            - clock
            - wifi
            - thermometer
            - droplet
            - bolt
            - home
            - person
            - arrow_up
            - arrow_down
            - arrow_left
            - arrow_right
            - heart
            - smiley
    number:
      example: 42
      selector:
        text:
    duration:
      default: 5
      selector:
        number:
          min: 0.5
          max: 86400
          step: 0.5
          unit_of_measurement: s
          mode: box
    brightness:
      default: 255
      selector:
        number:
          min: 5
          max: 255
    restore:
      selector:
        boolean:
    priority:
      default: normal
      selector:
        select:
          translation_key: priority
          options:
            - low
            - normal
            - high
    drop_if_busy:
      default: false
      selector:
        boolean:

draw_frame:
  target:
    entity:
      integration: obegraensad_lamp
  fields:
    rows:
      example: '["0000000000000000", "0FF00000000000F0", "..."]'
      selector:
        object:
    pixels:
      selector:
        object:
    duration:
      selector:
        number:
          min: 0.5
          max: 86400
          step: 0.5
          unit_of_measurement: s
          mode: box
    restore:
      selector:
        boolean:
    priority:
      default: normal
      selector:
        select:
          translation_key: priority
          options:
            - low
            - normal
            - high
    drop_if_busy:
      default: false
      selector:
        boolean:

clear:
  target:
    entity:
      integration: obegraensad_lamp
  fields:
    duration:
      selector:
        number:
          min: 0.5
          max: 86400
          step: 0.5
          unit_of_measurement: s
          mode: box
    restore:
      selector:
        boolean:
    priority:
      default: normal
      selector:
        select:
          translation_key: priority
          options:
            - low
            - normal
            - high
    drop_if_busy:
      default: false
      selector:
        boolean:

show_graph:
  target:
    entity:
      integration: obegraensad_lamp
  fields:
    values:
      example: "[3, 5, 8, 6, 9, 12]"
      selector:
        object:
    sensor:
      selector:
        entity:
          domain: sensor
    hours:
      default: 24
      selector:
        number:
          min: 0.1
          max: 720
          step: 0.1
          unit_of_measurement: h
          mode: box
    min:
      selector:
        number:
          mode: box
          step: any
    max:
      selector:
        number:
          mode: box
          step: any
    text:
      selector:
        text:
    delay:
      selector:
        number:
          min: 10
          max: 1000
          unit_of_measurement: ms
          mode: box
    duration:
      selector:
        number:
          min: 0.5
          max: 86400
          step: 0.5
          unit_of_measurement: s
          mode: box
    restore:
      selector:
        boolean:
    priority:
      default: normal
      selector:
        select:
          translation_key: priority
          options:
            - low
            - normal
            - high
    drop_if_busy:
      default: false
      selector:
        boolean:

restore_display:
  target:
    entity:
      integration: obegraensad_lamp
