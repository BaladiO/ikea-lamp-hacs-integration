[project]
name = "ikea-lamp-hacs-integration"
version = "0.1.0"
description = "Home Assistant integration for an IKEA OBEGRÄNSAD LED lamp running ph1p's ESP32 firmware"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.obegraensad_lamp"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "D", "PL", "PT", "TRY", "C4", "RET"]
ignore = ["D203", "D213", "ASYNC109", "RUF012", "PLR0913", "PLR2004", "TRY003", "PLR0911", "PLR0912", "PLR0915", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLC0415", "S101", "PT011", "PT018", "ASYNC109"]
"scripts/*" = ["D"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["homeassistant.*"]
implicit_reexport = true
